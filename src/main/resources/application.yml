# Spring Boot 主配置文件。放在 src/main/resources 下，启动时会被自动加载。
spring:
  application:
    # 应用名：会出现在启动日志里，后续 Docker / 监控也会用到
    name: first-m0

  # M1.3 新增：异步任务使用虚拟线程
  # 流式对话要把“等模型生成”放到后台线程，虚拟线程在这类 IO 等待场景开销极小
  threads:
    virtual:
      enabled: true

  # M0.2 新增：数据源配置
  datasource:
    # 连接本机 MySQL 的 first_m0 库；参数含义：
    #   useUnicode + characterEncoding：支持中文、避免乱码
    #   serverTimezone：时区，和项目约定的 Asia/Shanghai 一致
    #   useSSL=false：本地开发不加密连接
    #   allowPublicKeyRetrieval=true：MySQL 8 默认认证方式需要这个参数
    url: 'jdbc:mysql://localhost:3306/first_m0?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
    # 用户名和密码都从环境变量读取，带默认值。
    # 密码默认空，务必用环境变量 DB_PASSWORD 传入，不要写死在代码或配置文件里。
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # M0.2 新增：JPA 配置
  jpa:
    hibernate:
      # update：启动时检查表结构，缺表就建、缺列就加，不会删数据。
      # 适合学习阶段；正式项目一般改为 validate，并用 Flyway/Liquibase 管理建表脚本。
      ddl-auto: update
    # 关闭 Open Session In View，避免 Controller 里懒加载数据库数据，
    # 也能避免启动时那行 "spring.jpa.open-in-view is enabled by default" 警告。
    open-in-view: false

  # M0.5 新增：静态资源缓存策略
  web:
    resources:
      cache:
        # 开发阶段让浏览器每次都来问一下页面有没有更新，
        # 否则改了 index.html 刷新也看不到新版本（需要 Ctrl+F5 才行）。
        # 上线时再按需调大这个值。
        period: 0

server:
  # 内嵌 Tomcat 的监听端口；页面和接口都从 http://localhost:8080 访问
  port: 8080

# M1.1 新增：JWT 配置
jwt:
  # 签名密钥，HS256 要求至少 32 个字符。
  # 开发默认值写在代码里，正式环境必须用环境变量 JWT_SECRET 覆盖。
  secret: ${JWT_SECRET:}
  # token 有效期（小时），默认 7 天
  expire-hours: ${JWT_EXPIRE_HOURS:168}

# M0.3 新增：大模型配置
llm:
  # 模型服务地址；换成其他 OpenAI 兼容服务时改这里即可
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  # API Key 必须通过环境变量传入，绝对不要写在这里
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  # 读取超时（秒）；连接超时在客户端里固定 10 秒
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
