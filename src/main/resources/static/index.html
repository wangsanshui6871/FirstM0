<!doctype html>
<!--
  FirstM0 聊天页 —— M0.5 版本。
  职责：把「页面 → POST /api/chat → 模型 → 数据库」这条链路做成真正能用的聊天界面。
  已支持：会话 id 存 localStorage、刷新恢复历史、loading 状态、错误提示、新对话按钮。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstM0 · AI 客服骨架</title>
  <style>
    /* 主题配色变量：只改这里就能整体换肤，下面所有颜色都引用这些变量 */
    :root {
      --bg: #0f172a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --user: #1d4ed8;
      --bot: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.18), transparent 28%),
        radial-gradient(circle at 90% 100%, rgba(37, 99, 235, 0.22), transparent 30%),
        var(--bg);
    }

    .app {
      width: min(760px, 100%);
      min-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.2px;
    }

    h1 span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      padding: 5px 10px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 999px;
      color: var(--accent);
      font-size: 12px;
      white-space: nowrap;
    }

    /* 右上角：徽标 + 新对话按钮 */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 未登录时是“登录”链接，登录后变成用户名 */
    .user-link {
      padding: 5px 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    .user-link:hover {
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
    }

    .user-link.logged-in {
      color: var(--text);
      cursor: default;
    }

    .user-link.logged-in:hover {
      border-color: transparent;
      color: var(--text);
    }

    /* 次要按钮：透明背景，只在边框上做文章，和主按钮区分开 */
    button.secondary {
      padding: 6px 12px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
    }

    button.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      filter: none;
    }

    /* 请求进行中的“正在输入”气泡，比普通气泡淡一些 */
    .bubble.typing {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
      color: var(--muted);
      font-style: italic;
    }

    /* 输入中禁止重复提交 */
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input:disabled {
      opacity: 0.65;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      overflow-y: auto;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 4px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(2, 6, 23, 0.28);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      outline: none;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font-size: 14px;
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #082f49;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .hint {
      margin: 0;
      padding: 0 24px 16px;
      color: var(--muted);
      font-size: 12px;
    }

    code {
      padding: 2px 5px;
      border-radius: 5px;
      background: rgba(148, 163, 184, 0.14);
      color: #bae6fd;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>FirstM0 <span>AI 客服骨架</span></h1>
        <p>Spring Boot 3.5 · Java 21 · Maven</p>
      </div>
      <div class="header-actions">
        <a class="user-link" id="user-link" href="/login.html">登录</a>
        <span class="badge" id="session-label">新会话</span>
        <button type="button" class="secondary" id="new-chat">新对话</button>
      </div>
    </header>

    <main id="messages">
      <!-- 消息区：JS 会把用户/机器人气泡动态插入到这里 -->
      <div class="bubble bot">你好，我是 FirstM0 客服助手。发送消息会调用 <code>POST /api/chat</code>，由大模型生成回复，并保存到 MySQL。</div>
    </main>

    <form id="chat-form">
      <input id="message" autocomplete="off" placeholder="输入一句话，和客服助手聊聊…">
      <button type="submit" id="send-button">发送</button>
    </form>

    <p class="hint">会话 id 存在浏览器 localStorage 里，刷新页面会自动恢复最近 10 轮记录。</p>
  </div>

  <script>
    // ------------------------------------------------------------------
    // 1. 页面元素与状态
    // ------------------------------------------------------------------
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const messages = document.getElementById('messages');
    const sendButton = document.getElementById('send-button');
    const newChatButton = document.getElementById('new-chat');
    const sessionLabel = document.getElementById('session-label');
    const userLink = document.getElementById('user-link');

    // 右上角显示登录状态：有用户名就显示名字，没有就保留“登录”链接
    const storedUsername = localStorage.getItem('firstm0.username');
    if (storedUsername) {
      userLink.textContent = storedUsername;
      userLink.removeAttribute('href');
      userLink.classList.add('logged-in');
      userLink.title = '已登录（M1.2 会做退出登录）';
    }

    // localStorage 的 key：换名字等于换一份会话记录
    const STORAGE_KEY = 'firstm0.conversationId';

    // 当前会话 id：优先从 localStorage 恢复，没有就是 null（后端会新建）
    let conversationId = readStoredConversationId();

    // 页面打开时，如果之前有会话，就把历史消息拉回来
    restoreHistory();

    // ------------------------------------------------------------------
    // 2. 发送消息
    // ------------------------------------------------------------------
    form.addEventListener('submit', async (event) => {
      event.preventDefault();            // 阻止浏览器默认的“整页刷新”提交行为
      const text = input.value.trim();   // 去掉首尾空格
      if (!text) return;                 // 空内容不发请求

      addBubble(text, 'user');           // 先把用户的话画成气泡（乐观显示，不用等后端）
      input.value = '';                  // 清空输入框

      // 进入 loading 状态：禁止重复提交，并显示“正在输入”
      setBusy(true);
      const typingBubble = addBubble('正在输入…', 'typing');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // 带上会话 id：第一次是 null，之后一直复用同一个 id
          body: JSON.stringify({ conversationId: conversationId, message: text })
        });

        // 非 2xx：后端会返回统一的 { code, message }，优先把 message 展示给用户
        if (!response.ok) {
          const errorBody = await response.json().catch(() => null);
          throw new Error(errorBody?.message || 'HTTP ' + response.status);
        }

        const data = await response.json();
        conversationId = data.conversationId;   // 记住会话 id，下一句接着聊
        storeConversationId(conversationId);    // 存进 localStorage，刷新也不丢
        updateSessionLabel();

        typingBubble.remove();                  // 收到回复，移除“正在输入”气泡
        addBubble(data.reply, 'bot');
      } catch (error) {
        typingBubble.remove();
        addBubble('请求失败：' + error.message + '\n（检查后端是否启动，然后重试）', 'bot');
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    // ------------------------------------------------------------------
    // 3. 新对话
    // ------------------------------------------------------------------
    newChatButton.addEventListener('click', () => {
      conversationId = null;
      localStorage.removeItem(STORAGE_KEY);   // 清掉记住的 id，下次会新建会话

      // 清空消息区，只留一句欢迎语
      messages.innerHTML = '';
      addBubble('已开始新对话，之前的记录还在数据库里，只是这个页面不再接着聊。', 'bot');
      updateSessionLabel();
      input.focus();
    });

    // ------------------------------------------------------------------
    // 4. 刷新恢复：按 conversationId 拉历史消息
    // ------------------------------------------------------------------
    async function restoreHistory() {
      if (conversationId === null) {
        updateSessionLabel();
        return;
      }

      try {
        const response = await fetch('/api/conversations/' + conversationId + '/messages');

        // 404 说明这个会话在数据库里已经不存在了，清掉本地记录，当新会话处理
        if (response.status === 404) {
          conversationId = null;
          localStorage.removeItem(STORAGE_KEY);
          updateSessionLabel();
          return;
        }

        if (!response.ok) throw new Error('HTTP ' + response.status);

        const history = await response.json();
        if (history.length === 0) return;

        messages.innerHTML = '';   // 去掉欢迎语，换成真实历史
        history.forEach((item) => {
          addBubble(item.content, item.role === 'USER' ? 'user' : 'bot');
        });
      } catch (error) {
        // 恢复失败不影响继续聊天，只在控制台留个记录
        console.warn('恢复历史失败：', error.message);
        updateSessionLabel();
      }
    }

    // ------------------------------------------------------------------
    // 5. 小工具函数
    // ------------------------------------------------------------------

    // 往消息区追加一个气泡，并返回这个元素（方便之后删除“正在输入”）
    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;   // 用 textContent 而不是 innerHTML，可避免 XSS
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // 切换“发送中”状态
    function setBusy(busy) {
      sendButton.disabled = busy;
      input.disabled = busy;
      sendButton.textContent = busy ? '发送中…' : '发送';
    }

    // 右上角显示当前会话编号
    function updateSessionLabel() {
      sessionLabel.textContent = conversationId === null ? '新会话' : '会话 #' + conversationId;
    }

    // 读取 localStorage 里存的会话 id；没有或格式不对就返回 null
    function readStoredConversationId() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = Number(raw);

      return Number.isInteger(parsed) && parsed > 0 ? parsed : null;
    }

    function storeConversationId(id) {
      if (id !== null && id !== undefined) {
        localStorage.setItem(STORAGE_KEY, String(id));
      }
    }
  </script>
</body>
</html>
