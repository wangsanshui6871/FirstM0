<!doctype html>
<!--
  FirstM0 聊天页 —— M1.2 版本。
  职责：登录后聊天，左侧会话列表可切换/重命名/删除，右侧聊天。
  依赖接口：/api/auth/login、/api/conversations、/api/chat
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstM0 · AI 客服</title>
  <style>
    /* 主题配色变量：只改这里就能整体换肤，下面所有颜色都引用这些变量 */
    :root {
      --bg: #0f172a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --user: #1d4ed8;
      --bot: #1e293b;
      --line: rgba(148, 163, 184, 0.14);
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.18), transparent 28%),
        radial-gradient(circle at 90% 100%, rgba(37, 99, 235, 0.22), transparent 30%),
        var(--bg);
    }

    .app {
      width: min(1040px, 100%);
      min-height: calc(100vh - 48px);
      display: flex;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }

    /* ---------------- 左侧会话栏 ---------------- */

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.28);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .conv-list {
      flex: 1;
      margin: 0;
      padding: 8px;
      list-style: none;
      overflow-y: auto;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
    }

    .conv-item:hover { background: rgba(148, 163, 184, 0.1); }

    .conv-item.active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .conv-main { flex: 1; min-width: 0; }

    .conv-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-time {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    /* 小图标按钮：改名 / 删除 */
    .icon-button {
      padding: 2px 6px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      opacity: 0;
    }

    .conv-item:hover .icon-button { opacity: 1; }

    .icon-button:hover { color: var(--accent); background: rgba(148, 163, 184, 0.14); }

    .icon-button.danger:hover { color: var(--danger); }

    .empty-tip {
      padding: 16px 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .sidebar-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }

    .username {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .link-button:hover { color: var(--danger); }

    /* ---------------- 右侧聊天区 ---------------- */

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    h1 span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      overflow-y: auto;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 4px;
    }

    .bubble.typing {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
      color: var(--muted);
      font-style: italic;
    }

    /* 流式输出时的光标：让用户知道还在生成 */
    .bubble.streaming::after {
      content: '▍';
      margin-left: 2px;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.28);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      outline: none;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font-size: 14px;
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #082f49;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input:disabled { opacity: 0.65; }

    .primary-small {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ---------------- 窄屏：会话栏移到顶部 ---------------- */

    @media (max-width: 720px) {
      body { padding: 12px; }

      .app {
        flex-direction: column;
        min-height: calc(100vh - 24px);
      }

      .sidebar {
        width: 100%;
        max-height: 200px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .icon-button { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左侧：会话列表 + 当前用户 -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="brand">FirstM0</span>
        <button type="button" class="primary-small" id="new-chat">+ 新对话</button>
      </div>

      <ul class="conv-list" id="conversation-list"></ul>

      <div class="sidebar-foot">
        <span class="username" id="username">未登录</span>
        <button type="button" class="link-button" id="logout">退出</button>
      </div>
    </aside>

    <!-- 右侧：聊天区 -->
    <section class="chat">
      <header>
        <div>
          <h1>FirstM0 <span>AI 客服</span></h1>
          <p id="session-label">新会话</p>
        </div>
      </header>

      <main id="messages">
        <div class="bubble bot">你好，我是 FirstM0 客服助手。左侧可以切换历史会话，也可以开始新的对话。</div>
      </main>

      <form id="chat-form">
        <input id="message" autocomplete="off" placeholder="输入一句话，和客服助手聊聊…">
        <button type="submit" id="send-button">发送</button>
      </form>
    </section>
  </div>

  <script>
    // ------------------------------------------------------------------
    // 1. 常量与元素
    // ------------------------------------------------------------------
    const TOKEN_KEY = 'firstm0.token';
    const USERNAME_KEY = 'firstm0.username';
    const CONVERSATION_KEY = 'firstm0.conversationId';

    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const messages = document.getElementById('messages');
    const sendButton = document.getElementById('send-button');
    const newChatButton = document.getElementById('new-chat');
    const logoutButton = document.getElementById('logout');
    const usernameLabel = document.getElementById('username');
    const sessionLabel = document.getElementById('session-label');
    const conversationList = document.getElementById('conversation-list');

    // 当前会话 id：null 表示还没创建（下一条消息会新建）
    let conversationId = readStoredConversationId();

    // ------------------------------------------------------------------
    // 2. 启动检查：没登录直接去登录页
    // ------------------------------------------------------------------
    if (!localStorage.getItem(TOKEN_KEY)) {
      location.replace('/login.html');
    } else {
      usernameLabel.textContent = localStorage.getItem(USERNAME_KEY) || '已登录';
      start();
    }

    async function start() {
      updateSessionLabel();
      await loadConversations();
      if (conversationId !== null) {
        await loadHistory(conversationId);
      }
    }

    // ------------------------------------------------------------------
    // 3. 统一的请求封装：自动带 token，401 统一回登录页
    // ------------------------------------------------------------------
    async function apiFetch(url, options = {}) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = Object.assign({}, options.headers);

      if (token) headers['Authorization'] = 'Bearer ' + token;

      const response = await fetch(url, Object.assign({}, options, { headers }));

      if (response.status === 401) {
        clearLoginState();
        location.replace('/login.html');
        throw new Error('登录已过期');
      }

      return response;
    }

    // ------------------------------------------------------------------
    // 4. 会话列表
    // ------------------------------------------------------------------
    async function loadConversations() {
      try {
        const response = await apiFetch('/api/conversations');
        if (!response.ok) throw new Error('HTTP ' + response.status);

        const list = await response.json();
        renderConversations(list);
      } catch (error) {
        if (!error.message.includes('登录已过期')) {
          conversationList.innerHTML = '<li class="empty-tip">会话列表加载失败：' + error.message + '</li>';
        }
      }
    }

    function renderConversations(list) {
      conversationList.innerHTML = '';

      if (list.length === 0) {
        conversationList.innerHTML = '<li class="empty-tip">还没有会话。<br>在右侧发一句话就会自动创建。</li>';
        return;
      }

      list.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'conv-item' + (item.id === conversationId ? ' active' : '');
        li.dataset.id = item.id;

        const main = document.createElement('div');
        main.className = 'conv-main';

        const title = document.createElement('div');
        title.className = 'conv-title';
        title.textContent = item.title;

        const time = document.createElement('div');
        time.className = 'conv-time';
        time.textContent = formatTime(item.updatedAt);

        main.appendChild(title);
        main.appendChild(time);

        const renameButton = document.createElement('button');
        renameButton.type = 'button';
        renameButton.className = 'icon-button';
        renameButton.textContent = '改名';

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'icon-button danger';
        deleteButton.textContent = '删除';

        li.appendChild(main);
        li.appendChild(renameButton);
        li.appendChild(deleteButton);

        // 点整行切换会话；点按钮时阻止冒泡，避免误触发切换
        li.addEventListener('click', () => selectConversation(item.id));
        renameButton.addEventListener('click', (event) => {
          event.stopPropagation();
          renameConversation(item);
        });
        deleteButton.addEventListener('click', (event) => {
          event.stopPropagation();
          removeConversation(item);
        });

        conversationList.appendChild(li);
      });
    }

    // ------------------------------------------------------------------
    // 5. 切换 / 新建 / 改名 / 删除
    // ------------------------------------------------------------------
    async function selectConversation(id) {
      if (id === conversationId) return;

      conversationId = id;
      localStorage.setItem(CONVERSATION_KEY, String(id));
      updateSessionLabel();
      highlightActive();
      await loadHistory(id);
    }

    async function loadHistory(id) {
      try {
        const response = await apiFetch('/api/conversations/' + id + '/messages');

        // 会话可能已被删除：清掉本地记录，回到新会话状态
        if (response.status === 404) {
          resetToNewConversation('这个会话已经不存在了，已切换到新对话。');
          await loadConversations();
          return;
        }

        if (!response.ok) throw new Error('HTTP ' + response.status);

        const history = await response.json();
        messages.innerHTML = '';

        if (history.length === 0) {
          addBubble('这个会话还没有消息。', 'bot');
          return;
        }

        history.forEach((item) => {
          addBubble(item.content, item.role === 'USER' ? 'user' : 'bot');
        });
      } catch (error) {
        if (!error.message.includes('登录已过期')) {
          addBubble('历史记录加载失败：' + error.message, 'bot');
        }
      }
    }

    newChatButton.addEventListener('click', () => {
      resetToNewConversation('已开始新对话。发送第一条消息后会创建新的会话。');
    });

    async function renameConversation(item) {
      const nextTitle = prompt('输入新的会话标题（最多 100 字）', item.title);
      if (nextTitle === null) return;

      const trimmed = nextTitle.trim();
      if (!trimmed) {
        alert('标题不能为空');
        return;
      }

      try {
        const response = await apiFetch('/api/conversations/' + item.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: trimmed })
        });

        if (!response.ok) {
          const errorBody = await response.json().catch(() => null);
          throw new Error(errorBody?.message || 'HTTP ' + response.status);
        }

        await loadConversations();
      } catch (error) {
        if (!error.message.includes('登录已过期')) alert('改名失败：' + error.message);
      }
    }

    async function removeConversation(item) {
      if (!confirm('确定删除「' + item.title + '」吗？消息会一起删除，无法恢复。')) return;

      try {
        const response = await apiFetch('/api/conversations/' + item.id, { method: 'DELETE' });

        if (!response.ok && response.status !== 404) {
          const errorBody = await response.json().catch(() => null);
          throw new Error(errorBody?.message || 'HTTP ' + response.status);
        }

        // 删掉的正好是当前会话，就回到新会话
        if (item.id === conversationId) {
          resetToNewConversation('当前会话已删除，已切换到新对话。');
        }

        await loadConversations();
      } catch (error) {
        if (!error.message.includes('登录已过期')) alert('删除失败：' + error.message);
      }
    }

    function resetToNewConversation(tip) {
      conversationId = null;
      localStorage.removeItem(CONVERSATION_KEY);
      updateSessionLabel();
      highlightActive();

      messages.innerHTML = '';
      addBubble(tip, 'bot');
      input.focus();
    }

    // ------------------------------------------------------------------
    // 6. 发送消息（M1.3：SSE 流式）
    // ------------------------------------------------------------------
    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      addBubble(text, 'user');
      input.value = '';
      setBusy(true);

      // 机器人气泡先建好，后面收到一段就追加一段
      const botBubble = addBubble('', 'bot');
      botBubble.classList.add('streaming');

      let answer = '';

      try {
        const token = localStorage.getItem(TOKEN_KEY);

        // 不能用 EventSource：它只支持 GET，而且不能带 Authorization 头。
        // 所以用 fetch 发 POST，再手动读响应流。
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ conversationId: conversationId, message: text })
        });

        if (response.status === 401) {
          clearLoginState();
          location.replace('/login.html');
          return;
        }

        if (!response.ok) {
          const errorBody = await response.json().catch(() => null);
          throw new Error(errorBody?.message || 'HTTP ' + response.status);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          // SSE 的事件之间用空行分隔：event: xxx\ndata: {...}\n\n
          let separator;
          while ((separator = buffer.indexOf('\n\n')) >= 0) {
            const rawEvent = buffer.slice(0, separator);
            buffer = buffer.slice(separator + 2);

            const event = parseSseEvent(rawEvent);
            if (!event) continue;

            if (event.name === 'meta') {
              conversationId = event.data.conversationId;
              localStorage.setItem(CONVERSATION_KEY, String(conversationId));
              updateSessionLabel();
            } else if (event.name === 'delta') {
              answer += event.data.content;
              botBubble.textContent = answer;
              messages.scrollTop = messages.scrollHeight;
            } else if (event.name === 'done') {
              // 用服务端的完整回复兜底一次，防止中间丢包
              answer = event.data.reply || answer;
              botBubble.textContent = answer;
              await loadConversations();
            } else if (event.name === 'error') {
              throw new Error(event.data.message || '生成失败');
            }
          }
        }

        if (!answer) {
          botBubble.textContent = '没有收到回复，请稍后重试。';
        }

      } catch (error) {
        botBubble.classList.remove('streaming');

        if (answer) {
          // 已经显示了一部分：保留内容，只在后面提示中断
          addBubble('（回复中断：' + error.message + '）', 'bot');
        } else {
          botBubble.textContent = '请求失败：' + error.message + '\n（检查后端是否启动，然后重试）';
        }
      } finally {
        botBubble.classList.remove('streaming');
        setBusy(false);
        input.focus();
      }
    });

    /**
     * 把一段原始 SSE 文本解析成 { name, data }。
     * 形如：
     *   event:delta
     *   data:{"content":"你"}
     */
    function parseSseEvent(rawEvent) {
      const lines = rawEvent.split(/\r?\n/);
      let name = 'message';
      const dataLines = [];

      lines.forEach((line) => {
        if (line.startsWith('event:')) {
          name = line.slice('event:'.length).trim();
        } else if (line.startsWith('data:')) {
          dataLines.push(line.slice('data:'.length).trim());
        }
      });

      if (dataLines.length === 0) return null;

      try {
        return { name: name, data: JSON.parse(dataLines.join('\n')) };
      } catch (error) {
        return null;
      }
    }

    // ------------------------------------------------------------------
    // 7. 退出登录
    // ------------------------------------------------------------------
    logoutButton.addEventListener('click', () => {
      if (!confirm('确定退出登录吗？')) return;

      clearLoginState();
      location.replace('/login.html');
    });

    // ------------------------------------------------------------------
    // 8. 小工具
    // ------------------------------------------------------------------
    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;   // 用 textContent 而不是 innerHTML，可避免 XSS
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function setBusy(busy) {
      sendButton.disabled = busy;
      input.disabled = busy;
      sendButton.textContent = busy ? '发送中…' : '发送';
    }

    function updateSessionLabel() {
      sessionLabel.textContent = conversationId === null ? '新会话' : '会话 #' + conversationId;
    }

    function highlightActive() {
      document.querySelectorAll('.conv-item').forEach((li) => {
        li.classList.toggle('active', Number(li.dataset.id) === conversationId);
      });
    }

    function formatTime(iso) {
      const date = new Date(iso);
      const pad = (value) => String(value).padStart(2, '0');

      return pad(date.getMonth() + 1) + '-' + pad(date.getDate())
          + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    function readStoredConversationId() {
      const parsed = Number(localStorage.getItem(CONVERSATION_KEY));

      return Number.isInteger(parsed) && parsed > 0 ? parsed : null;
    }

    function clearLoginState() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USERNAME_KEY);
      localStorage.removeItem(CONVERSATION_KEY);
    }
  </script>
</body>
</html>
